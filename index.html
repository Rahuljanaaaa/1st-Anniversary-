<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Who is your Headache?</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff4d88,#ff80ab);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.container{
text-align:center;
}

h1{
color:white;
margin-bottom:40px;
font-size:35px;
text-shadow:0 0 10px #ff0055;
}

.people{
display:flex;
gap:50px;
justify-content:center;
flex-wrap:wrap;
}

.person{
cursor:pointer;
transition:.3s;
}

.person img{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
border:5px solid white;
box-shadow:0 0 20px rgba(255,255,255,.6);
}

.person p{
color:white;
font-size:22px;
margin-top:12px;
font-weight:bold;
}

#ankit{
position:relative;
}

</style>

</head>

<body>

<div class="container">

<h1>💖 Which is your Headache? 💖</h1>

<div class="people">

<div class="person" onclick="rahul()">
<img src="rahul.jpg">
<p>Rahul ❤️</p>
</div>


<div class="person" id="ankit" onclick="moveAnkit()">
<img src="9f4b848773c603c3899c26d853c981e3.jpg">
<p>?</p>
</div>

</div>

</div>


<script>

function rahul(){

alert("Congratulations ❤️ You found your Headache 😜");

}


function moveAnkit(){

let a=document.getElementById("ankit");

a.style.position="absolute";

a.style.left=Math.random()*(window.innerWidth-180)+"px";

a.style.top=Math.random()*(window.innerHeight-180)+"px";

}

</script>


</body>
</html>
